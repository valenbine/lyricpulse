name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @lyricpulse/web build

      - name: Build Windows installer
        run: pnpm --filter @lyricpulse/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List desktop artifacts
        shell: pwsh
        run: Get-ChildItem -Path apps/desktop/dist -Recurse | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricpulse-windows-installer
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
          if-no-files-found: error
